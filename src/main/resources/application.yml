spring:
  application:
    name: jobflow
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jobflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.jobflow: INFO
    org.hibernate.SQL: WARN

jobflow:
  auth0:
    enabled: ${AUTH0_ENABLED:false}
    issuer-uri: ${AUTH0_ISSUER_URI:}
    audience: ${AUTH0_AUDIENCE:}
    client-id: ${AUTH0_CLIENT_ID:}
  scheduler:
    poll-interval: ${SCHEDULER_POLL_INTERVAL:1000}
    batch-size: ${SCHEDULER_BATCH_SIZE:100}
  executor:
    core-pool-size: ${WORKER_CORE_POOL_SIZE:4}
    max-pool-size: ${WORKER_MAX_POOL_SIZE:8}
    queue-capacity: ${WORKER_QUEUE_CAPACITY:100}
    shutdown-wait-seconds: ${WORKER_SHUTDOWN_WAIT_SECONDS:30}
